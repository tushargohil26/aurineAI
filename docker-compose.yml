services:
  ollama:
    image: ollama/ollama:latest
    container_name: aurine-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
      - ./Modelfile:/setup/Modelfile:ro
      - ./Modelfile-native:/setup/Modelfile-native:ro
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull qwen2.5-coder:7b
        ollama pull nomic-embed-text
        ollama create aurine-coder -f /setup/Modelfile || true
        ollama create aurine-native -f /setup/Modelfile-native || true
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: aurine-nexus
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${NEXUS_PORT:-8000}:8000"
    volumes:
      - aurine_data:/var/data
    environment:
      - AI_PROVIDER=aurine
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen2.5-coder:7b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - AURINE_NATIVE_MODEL=qwen2.5-coder:7b
      - AURINE_EMBEDDING_MODEL=nomic-embed-text
      - DATA_DIR=/var/data/data
      - VECTOR_DB=/var/data/vector_store.sqlite3
      - GENERATED_PROJECTS_DIR=/var/data/generated_projects
      - PORT=8000

volumes:
  ollama_models:
  aurine_data:
